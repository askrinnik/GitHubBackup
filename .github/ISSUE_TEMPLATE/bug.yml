name: Ошибка
description: Приложение ведёт себя не так, как описано в docs/PRD.md.
title: "<English title>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **PRD — источник истины.** Ошибка — это расхождение с [docs/PRD.md](https://github.com/askrinnik/GitHubBackup/blob/main/docs/PRD.md). Если PRD не описывает ожидаемое поведение, сначала обновляется PRD.
        Заголовок — на английском; тело — на русском.
  - type: textarea
    id: prd-sections
    attributes:
      label: Источник требований — разделы PRD
      description: Ссылки на разделы `docs/PRD.md`, описывающие ожидаемое поведение.
      value: |
        Главный документ: [docs/PRD.md](https://github.com/askrinnik/GitHubBackup/blob/main/docs/PRD.md).

        Разделы PRD:
        - [<номер. Название>](https://github.com/askrinnik/GitHubBackup/blob/main/docs/PRD.md#<якорь>)
    validations:
      required: true
  - type: input
    id: requirement-ids
    attributes:
      label: Источник требований — номера требований
      description: Идентификаторы нарушенных требований (`FR-x.y`, `NFR-x`). Если их нет, поставьте «—».
      placeholder: FR-1.1, NFR-3
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Команда CLI или действия в UI, настройки, состав репозиториев.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
      description: Что должно происходить по PRD.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Что происходит; код выхода, сообщение, фрагмент лога (без токена GitHub).
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Окружение
      description: Версия приложения, Windows, версии git и 7-Zip.
    validations:
      required: false
  - type: textarea
    id: dependencies
    attributes:
      label: Зависимости
      description: Номера блокирующих issue (`- #n`) или «—».
      value: |
        —
    validations:
      required: true
