name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/GitHubBackup.slnx

      - name: Build
        run: dotnet build src/GitHubBackup.slnx --no-restore -clp:ErrorsOnly

      - name: Format check
        run: dotnet format src/GitHubBackup.slnx --verify-no-changes --no-restore

      # Test cases of the Claude Code hook scripts; each script exits with 1 when a case fails.
      - name: Hook test cases
        timeout-minutes: 5
        run: |
          $suites = @(Get-ChildItem .claude/hooks/tests -Filter *.Cases.ps1)
          if ($suites.Count -eq 0) { throw 'No hook test cases found in .claude/hooks/tests.' }
          $failed = @()
          foreach ($cases in $suites) {
            pwsh -NoProfile -File $cases.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $cases.Name }
          }
          if ($failed) { throw "Hook test cases failed: $($failed -join ', ')" }

      # Both hosts as framework-dependent single-file executables in one folder; the tests check that folder.
      - name: Publish
        run: ./scripts/publish.ps1 -OutputPath artifacts/publish

      # UI and Smoke suites run in ui-smoke-tests.yml; the UI test project is skipped unless built with
      # RunUITests=true. Exit code 8 (zero tests ran) is not ignored, so a project that runs no tests fails CI.
      # PUBLISHED_APP_PATH points the publishing tests at the folder of the Publish step instead of publishing again.
      - name: Test
        env:
          PUBLISHED_APP_PATH: ${{ github.workspace }}/artifacts/publish
        run: >
          dotnet test --solution src/GitHubBackup.slnx --no-build
          --filter-not-trait "Category=Smoke"
          --report-xunit-trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn

      - name: Upload application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GitHubBackup
          path: artifacts/publish/
          if-no-files-found: error
