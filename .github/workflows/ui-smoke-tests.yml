name: UI and smoke tests

on:
  workflow_dispatch:
    inputs:
      category:
        description: Test category to run
        type: choice
        options:
          - UI
          - Smoke
        default: UI

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  ui-smoke-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/GitHubBackup.slnx

      # RunUITests=true includes the UI test project, which a plain solution build leaves out of test runs.
      - name: Build
        run: dotnet build src/GitHubBackup.slnx --no-restore -clp:ErrorsOnly -p:RunUITests=true

      # Projects without tests of the chosen category report exit code 8 (zero tests ran).
      # No Smoke tests exist yet, so choosing Smoke currently runs nothing.
      # The UI tests need git, 7-Zip and the interactive desktop of the runner; a failed UI test leaves screenshots
      # of the application windows in the folder named by UI_TEST_SCREENSHOTS.
      - name: Test
        env:
          TEST_CATEGORY: ${{ inputs.category }}
          UI_TEST_SCREENSHOTS: ${{ github.workspace }}/TestResults/Screenshots
        run: >
          dotnet test --solution src/GitHubBackup.slnx --no-build -p:RunUITests=true
          --filter-trait "Category=$env:TEST_CATEGORY"
          --ignore-exit-code 8
          --report-xunit-trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ inputs.category }}
          path: |
            TestResults/*.trx
            TestResults/Screenshots/*.png
          if-no-files-found: warn
